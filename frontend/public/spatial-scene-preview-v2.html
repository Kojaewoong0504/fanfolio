<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spatial Depth Card v2</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, Pretendard, sans-serif; }
    body { margin: 0; background: #090a1e; color: #f8f7ff; }
    main { width: min(760px, calc(100% - 32px)); margin: auto; padding: 28px 0 56px; }
    h1 { margin: 0 0 8px; font-size: clamp(25px, 5vw, 40px); }
    p { color: #bcbad5; line-height: 1.6; }
    button { border: 0; border-radius: 10px; padding: 12px 16px; color: white; background: #694ee9; font-weight: 800; }
    .toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 20px 0; padding: 14px; border: 1px solid #40416a; border-radius: 14px; background: #14152f; }
    #status { color: #9cf1ca; font-size: 12px; font-weight: 800; }
    .stage { display: grid; place-items: center; min-height: 650px; perspective: 1000px; border-radius: 20px; background: radial-gradient(circle, #39377b, #10112d 72%); overflow: hidden; }
    .card { position: relative; width: min(300px, 72%); aspect-ratio: 2 / 3; transform-style: preserve-3d; transition: transform 70ms linear; filter: drop-shadow(28px 32px 22px #000b); overflow: hidden; isolation: isolate; contain: paint; }
    .card::after { content: ''; position: absolute; inset: 0; z-index: 5; border: 1px solid #fff9; border-radius: 18px; pointer-events: none; box-shadow: inset 0 0 28px #fff4, 0 0 22px #765cff88; transform: translateZ(38px); }
    canvas, .subject, .face-light, .gloss { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 18px; }
    canvas { z-index: 0; }
    .subject { z-index: 2; background: url('/src/assets/card-minho-midnight.jpg') center / cover no-repeat; transform: translate3d(var(--sx), var(--sy), 24px) scale(1.025); -webkit-mask: url('/spatial/card-minho-mask.svg') center / 100% 100% no-repeat; mask: url('/spatial/card-minho-mask.svg') center / 100% 100% no-repeat; clip-path: inset(0 round 18px); filter: drop-shadow(0 11px 8px #000b); pointer-events: none; }
    .face-light { z-index: 3; background: radial-gradient(circle at var(--lx) var(--ly), #fff8, transparent 18%); mix-blend-mode: screen; transform: translateZ(30px); pointer-events: none; }
    .gloss { z-index: 4; background: linear-gradient(115deg, transparent 35%, #fff7 48%, transparent 58%); mix-blend-mode: screen; transform: translateZ(44px); pointer-events: none; }
    .label { margin-top: 15px; color: #aaa9c8; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>인물 분리형 Spatial Depth Card</h1>
    <p>배경과 인물 전경을 서로 다른 깊이·Z축으로 렌더링하는 개선 프리뷰입니다. 현재 전경 마스크는 개발용이며, 운영에서는 AI 분할 결과로 교체합니다.</p>
    <div class="toolbar"><button id="sensor">휴대폰 기울기 센서 사용</button><span id="status">터치/마우스로 시차 확인 가능</span></div>
    <div class="stage" id="stage"><div class="card" id="card"><canvas id="view" aria-label="인물 분리형 깊이 카드"></canvas><div class="subject"></div><div class="face-light"></div><div class="gloss"></div></div></div>
    <div class="label">배경 → 깊이맵 시차 · 인물 → 별도 전경 레이어 · 반사광 → 최상위 레이어</div>
  </main>
  <script>
    const card = document.querySelector('#card'), stage = document.querySelector('#stage'), canvas = document.querySelector('#view'), ctx = canvas.getContext('2d'), status = document.querySelector('#status');
    const image = new Image(); image.src = '/src/assets/card-minho-midnight.jpg'; let point = { x: .5, y: .5 };
    function resize() { const r = canvas.getBoundingClientRect(), d = Math.min(devicePixelRatio || 1, 2); canvas.width = r.width * d; canvas.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0); return r; }
    function draw() { const r = resize(), x = (point.x - .5) * 22, y = (point.y - .5) * 22; ctx.clearRect(0, 0, r.width, r.height); ctx.save(); ctx.translate(x * -.5, y * -.5); ctx.drawImage(image, 0, 0, r.width, r.height); ctx.restore(); card.style.transform = `rotateX(${y * -1.25}deg) rotateY(${x * 1.5}deg)`; card.style.setProperty('--sx', `${x * .95}px`); card.style.setProperty('--sy', `${y * .95}px`); card.style.setProperty('--lx', `${point.x * 100}%`); card.style.setProperty('--ly', `${point.y * 100}%`); }
    image.onload = draw; window.addEventListener('resize', draw);
    stage.addEventListener('pointermove', e => { const r = stage.getBoundingClientRect(); point = { x: Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), y: Math.max(0, Math.min(1, (e.clientY - r.top) / r.height)) }; draw(); });
    stage.addEventListener('pointerleave', () => { point = { x: .5, y: .5 }; draw(); });
    document.querySelector('#sensor').addEventListener('click', async () => { try { if (typeof DeviceOrientationEvent?.requestPermission === 'function' && await DeviceOrientationEvent.requestPermission() !== 'granted') throw Error(); window.addEventListener('deviceorientation', e => { point = { x: Math.max(0, Math.min(1, (e.gamma + 30) / 60)), y: Math.max(0, Math.min(1, (e.beta - 15) / 60)) }; draw(); }); status.textContent = '센서 활성 · 기기를 기울여 보세요'; } catch { status.textContent = '센서 권한 거부 · 터치/마우스로 확인하세요'; } });
  </script>
</body>
</html>
