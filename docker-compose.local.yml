services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fanfolio
      POSTGRES_USER: fanfolio
      POSTGRES_PASSWORD: fanfolio-local-only
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanfolio -d fanfolio"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - fanfolio-postgres:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.26
    restart: unless-stopped
    ports:
      - "${SMTP_HOST_PORT:-1025}:1025"
      - "${MAILPIT_HOST_PORT:-8025}:8025"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  fanfolio-postgres:
