<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card Operations Visual QA</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; color: #17172b; font-family: sans-serif; background: #e9eaf2; }
      h1 { margin: 0 0 18px; font-size: 20px; }
      main { display: grid; gap: 28px; }
      section { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
      h2 { grid-column: 1 / -1; margin: 0; font-size: 16px; }
      figure { margin: 0; padding: 12px; background: #fff; border-radius: 14px; box-shadow: 0 10px 28px #17172b18; }
      figcaption { margin-bottom: 10px; color: #6258dd; font-size: 13px; font-weight: 800; }
      img { display: block; width: 100%; height: auto; border: 1px solid #e1e2eb; }
    </style>
  </head>
  <body>
    <h1>카드 운영 화면 — 기준 시안 / 구현 프리뷰</h1>
    <main>
      <section><h2>카드 관리</h2><figure><figcaption>기준 시안</figcaption><img src="./assets/preview/card-management-reference.png" alt="카드 관리 기준 시안" /></figure><figure><figcaption>구현 프리뷰</figcaption><img src="./assets/preview/card-operations-final-card.png" alt="카드 관리 구현 프리뷰" /></figure></section>
      <section><h2>카드 구성 편집</h2><figure><figcaption>기준 시안</figcaption><img src="./assets/preview/card-composition-reference.png" alt="카드 구성 편집 기준 시안" /></figure><figure><figcaption>구현 프리뷰</figcaption><img src="./assets/preview/card-operations-final-composition.png" alt="카드 구성 편집 구현 프리뷰" /></figure></section>
      <section><h2>발급·인증번호</h2><figure><figcaption>기준 시안</figcaption><img src="./assets/preview/issuance-reference.png" alt="발급 인증번호 기준 시안" /></figure><figure><figcaption>구현 프리뷰</figcaption><img src="./assets/preview/card-operations-final-issuance.png" alt="발급 인증번호 구현 프리뷰" /></figure></section>
    </main>
  </body>
</html>
