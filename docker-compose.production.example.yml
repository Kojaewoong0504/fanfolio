services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - fanfolio-production-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA:?AUTO_CREATE_SCHEMA is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      STORAGE_DIR: ${STORAGE_DIR:?STORAGE_DIR is required}
      STORAGE_BACKEND: ${STORAGE_BACKEND:?STORAGE_BACKEND is required}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-fanfolio}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      DOWNLOAD_SIGNING_SECRET: ${DOWNLOAD_SIGNING_SECRET:?DOWNLOAD_SIGNING_SECRET is required}
      ASSET_SCAN_MODE: ${ASSET_SCAN_MODE:?ASSET_SCAN_MODE is required}
      CLAMAV_HOST: ${CLAMAV_HOST:?CLAMAV_HOST is required}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-5}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?FRONTEND_ORIGINS is required}
      MAIL_DELIVERY_MODE: ${MAIL_DELIVERY_MODE:?MAIL_DELIVERY_MODE is required}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_BASE_URL: ${RESEND_BASE_URL:-https://api.resend.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      PUSH_DELIVERY_MODE: ${PUSH_DELIVERY_MODE:-console}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_TOKEN_URL: ${FIREBASE_TOKEN_URL:-https://oauth2.googleapis.com/token}
      FIREBASE_API_BASE_URL: ${FIREBASE_API_BASE_URL:-https://fcm.googleapis.com}
      TASK_QUEUE_MODE: ${TASK_QUEUE_MODE:?TASK_QUEUE_MODE is required}
      SPATIAL_SCENE_PROVIDER: ${SPATIAL_SCENE_PROVIDER:-local_fallback}
      SPATIAL_SCENE_AI_URL: ${SPATIAL_SCENE_AI_URL:-}
      SPATIAL_SCENE_AI_TOKEN: ${SPATIAL_SCENE_AI_TOKEN:-}
      SPATIAL_SCENE_AI_TIMEOUT_SECONDS: ${SPATIAL_SCENE_AI_TIMEOUT_SECONDS:-90}
      UPLOAD_CLEANUP_INTERVAL_SECONDS: ${UPLOAD_CLEANUP_INTERVAL_SECONDS:-900}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND is required}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:?RATE_LIMIT_BACKEND is required}
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:?RATE_LIMIT_REDIS_URL is required}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "${API_BIND:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - fanfolio-production-storage:/var/lib/fanfolio/storage

  spatial-worker:
    profiles: ["ai"]
    build:
      context: .
      dockerfile: spatial_worker/Dockerfile
    restart: unless-stopped
    environment:
      SPATIAL_SCENE_WORKER_TOKEN: ${SPATIAL_SCENE_AI_TOKEN:?SPATIAL_SCENE_AI_TOKEN is required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA:?AUTO_CREATE_SCHEMA is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      STORAGE_DIR: ${STORAGE_DIR:?STORAGE_DIR is required}
      STORAGE_BACKEND: ${STORAGE_BACKEND:?STORAGE_BACKEND is required}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-fanfolio}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      ASSET_SCAN_MODE: ${ASSET_SCAN_MODE:?ASSET_SCAN_MODE is required}
      CLAMAV_HOST: ${CLAMAV_HOST:?CLAMAV_HOST is required}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-5}
      MAIL_DELIVERY_MODE: ${MAIL_DELIVERY_MODE:?MAIL_DELIVERY_MODE is required}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_BASE_URL: ${RESEND_BASE_URL:-https://api.resend.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      PUSH_DELIVERY_MODE: ${PUSH_DELIVERY_MODE:-console}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_TOKEN_URL: ${FIREBASE_TOKEN_URL:-https://oauth2.googleapis.com/token}
      FIREBASE_API_BASE_URL: ${FIREBASE_API_BASE_URL:-https://fcm.googleapis.com}
      TASK_QUEUE_MODE: ${TASK_QUEUE_MODE:?TASK_QUEUE_MODE is required}
      UPLOAD_CLEANUP_INTERVAL_SECONDS: ${UPLOAD_CLEANUP_INTERVAL_SECONDS:-900}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND is required}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:?RATE_LIMIT_BACKEND is required}
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:?RATE_LIMIT_REDIS_URL is required}
    command: celery -A app.tasks:celery_app worker --loglevel=INFO
    volumes:
      - fanfolio-production-storage:/var/lib/fanfolio/storage

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA:?AUTO_CREATE_SCHEMA is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      STORAGE_DIR: ${STORAGE_DIR:?STORAGE_DIR is required}
      STORAGE_BACKEND: ${STORAGE_BACKEND:?STORAGE_BACKEND is required}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_REGION: ${S3_REGION:-ap-northeast-2}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-fanfolio}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      ASSET_SCAN_MODE: ${ASSET_SCAN_MODE:?ASSET_SCAN_MODE is required}
      CLAMAV_HOST: ${CLAMAV_HOST:?CLAMAV_HOST is required}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-5}
      MAIL_DELIVERY_MODE: ${MAIL_DELIVERY_MODE:?MAIL_DELIVERY_MODE is required}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_BASE_URL: ${RESEND_BASE_URL:-https://api.resend.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      PUSH_DELIVERY_MODE: ${PUSH_DELIVERY_MODE:-console}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_TOKEN_URL: ${FIREBASE_TOKEN_URL:-https://oauth2.googleapis.com/token}
      FIREBASE_API_BASE_URL: ${FIREBASE_API_BASE_URL:-https://fcm.googleapis.com}
      TASK_QUEUE_MODE: ${TASK_QUEUE_MODE:?TASK_QUEUE_MODE is required}
      UPLOAD_CLEANUP_INTERVAL_SECONDS: ${UPLOAD_CLEANUP_INTERVAL_SECONDS:-900}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:?CELERY_BROKER_URL is required}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:?CELERY_RESULT_BACKEND is required}
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:?RATE_LIMIT_BACKEND is required}
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:?RATE_LIMIT_REDIS_URL is required}
    command: celery -A app.tasks:celery_app beat --loglevel=INFO
    volumes:
      - fanfolio-production-storage:/var/lib/fanfolio/storage

volumes:
  fanfolio-production-postgres:
  fanfolio-production-storage:
