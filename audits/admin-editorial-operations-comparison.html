<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin editorial comparison</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 28px; background: #f5f6fb; color: #101733; font-family: Arial, sans-serif; }
      h1 { margin: 0 0 20px; font-size: 22px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      figure { margin: 0; padding: 14px; border: 1px solid #dfe3ef; border-radius: 16px; background: white; box-shadow: 0 14px 36px rgba(17, 26, 67, .08); }
      figcaption { margin: 0 0 12px; color: #5b6280; font-size: 13px; font-weight: 700; letter-spacing: .08em; }
      img { display: block; width: 100%; height: 520px; object-fit: contain; object-position: top center; border-radius: 10px; background: #fafaff; }
    </style>
  </head>
  <body>
    <h1>관리자 검수 콘솔 — 선택 레퍼런스와 구현 결과</h1>
    <div class="grid">
      <figure><figcaption>REFERENCE</figcaption><img src="./admin-editorial-reference.png" alt="선택한 관리자 디자인 레퍼런스" /></figure>
      <figure><figcaption>IMPLEMENTATION</figcaption><img src="./admin-editorial-operations.png" alt="구현된 관리자 검수 콘솔" /></figure>
    </div>
  </body>
</html>
