<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fan Collection Spotlight QA</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #e9e9ef; color: #171a36; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", sans-serif; }
    main { display: grid; grid-template-columns: repeat(2, 430px); gap: 28px; justify-content: center; }
    figure { margin: 0; }
    figcaption { margin-bottom: 10px; font-size: 14px; font-weight: 800; letter-spacing: .04em; }
    img { display: block; width: 430px; height: auto; border-radius: 18px; background: #fff; box-shadow: 0 16px 40px #171a3620; }
  </style>
</head>
<body>
  <main>
    <figure><figcaption>SELECTED REFERENCE</figcaption><img src="fan-collection-spotlight-reference.png" alt="선택한 팬앱 디자인 레퍼런스"></figure>
    <figure><figcaption>IMPLEMENTATION · 430px VIEWPORT</figcaption><img src="fan-collection-spotlight-viewport.png" alt="구현된 팬앱 모바일 화면"></figure>
  </main>
</body>
</html>
