services:
  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fanfolio-local
      MINIO_ROOT_PASSWORD: fanfolio-local-secret
      # Community MinIO exposes CORS at the cluster level. Bucket-level
      # `mc cors set` is an AiStor-only API and fails in the open-source image.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173,http://localhost:4174,http://localhost:4175
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - fanfolio-minio:/data

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: fanfolio-local
      MINIO_ROOT_PASSWORD: fanfolio-local-secret
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/fanfolio-test"

  clamav:
    # Pin a current official multi-architecture Debian image. The floating
    # `latest` tag may resolve to a manifest without linux/arm64.
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.5.3-debian13-slim}
    ports:
      - "${CLAMAV_HOST_PORT:-3310}:3310"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/3310'"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  fanfolio-minio:
