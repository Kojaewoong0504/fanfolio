default_stages: [pre-commit]
repos:
  - repo: local
    hooks:
      - id: backend-ruff-format
        name: Backend Ruff format check
        entry: ruff format --check
        language: system
        files: ^backend/.*\.py$
      - id: backend-ruff
        name: Backend Ruff lint
        entry: ruff check
        language: system
        files: ^backend/.*\.py$
      - id: frontend-lint
        name: Frontend lint
        entry: npm --prefix frontend run lint
        language: system
        pass_filenames: false
        files: ^frontend/
