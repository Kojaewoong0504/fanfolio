name: Fanfolio CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/tests/*.test.mjs
      - run: bash -n scripts/*.sh

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
      - run: uv sync --locked --dev
      - name: Run backend tests in isolated parallel workers
        run: .venv/bin/pytest -q -n auto --dist worksteal
      - name: Verify isolated authentication contracts
        run: .venv/bin/pytest -q tests/contract/test_auth.py
      - run: .venv/bin/ruff check app tests
      - run: .venv/bin/ruff format --check app tests
      - name: Validate production configuration
        env:
          APP_ENV: production
          AUTO_CREATE_SCHEMA: "false"
          DATABASE_URL: postgresql+asyncpg://fanfolio:ci-only@localhost:5432/fanfolio
          FRONTEND_URL: https://app.fanfolio.example
          FRONTEND_ORIGINS: https://app.fanfolio.example
          MAIL_DELIVERY_MODE: smtp
          MAIL_FROM: "Fanfolio <no-reply@fanfolio.example>"
          SMTP_HOST: smtp.fanfolio.example
          RATE_LIMIT_BACKEND: redis
          RATE_LIMIT_REDIS_URL: redis://localhost:6379/1
          DATA_PROTECTION_KEY: ci-only-production-preflight-key-32-characters-minimum
          DOWNLOAD_SIGNING_SECRET: ci-only-download-signing-secret
          JWT_ACCESS_SECRET: ci-only-jwt-access-secret
          JWT_REFRESH_SECRET: ci-only-jwt-refresh-secret
          ASSET_SCAN_MODE: clamav
          CLAMAV_HOST: clamav.internal
          OAUTH_FRONTEND_CALLBACK_URL: https://app.fanfolio.example/oauth/callback
          GOOGLE_REDIRECT_URI: https://app.fanfolio.example/oauth/google/callback
          KAKAO_REDIRECT_URI: https://app.fanfolio.example/oauth/kakao/callback
        run: ../scripts/production-preflight.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Enforce mobile asset performance budget
        run: npm run perf:budget
      - run: npm audit --omit=dev --audit-level=high

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: node --test tests/*.test.mjs

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: builder_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: node --check studio-core.js
      - run: npm test

  hosted-preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check deployed Render and Vercel applications
        run: ./scripts/hosted-preflight.sh

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
      - run: uv sync --locked --dev
        working-directory: backend
      - run: STOP_SERVICES=1 ./scripts/integration-smoke.sh

  storage-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.2"
      - run: uv sync --locked --dev
        working-directory: backend
      - run: ./scripts/storage-integration-smoke.sh

  production-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        run: docker compose --env-file .env.production.example -f docker-compose.production.example.yml config --quiet

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the application image
        run: docker compose -f docker-compose.stack.yml build api worker
      - name: Start the application stack
        run: docker compose -f docker-compose.stack.yml up -d
      - name: Wait for API readiness
        run: |
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8000/api/health/ready; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.stack.yml logs api worker
          exit 1
      - name: Verify the Celery worker
        run: docker compose -f docker-compose.stack.yml exec -T worker celery -A app.tasks:celery_app inspect ping --timeout=5
      - name: Verify SMTP delivery through Mailpit
        run: |
          curl -fsS -X POST http://localhost:8000/api/auth/magic-link/request \
            -H 'Content-Type: application/json' \
            -d '{"email":"container@example.com","purpose":"login"}'
          for attempt in {1..30}; do
            if curl -fsS http://localhost:8025/api/v1/messages | grep -Fq 'container@example.com'; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f docker-compose.stack.yml logs api mailpit
          exit 1
      - name: Verify Redis-backed rate limiting
        run: |
          email="container-rate-limit@example.com"
          for attempt in {1..5}; do
            status_code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              http://localhost:8000/api/auth/magic-link/request \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"$email\",\"purpose\":\"login\"}")"
            test "$status_code" = "202"
          done
          status_code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            http://localhost:8000/api/auth/magic-link/request \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$email\",\"purpose\":\"login\"}")"
          test "$status_code" = "429"
      - name: Verify the API is non-root
        run: |
          uid="$(docker compose -f docker-compose.stack.yml exec -T api id -u | tr -d '\r\n')"
          test "$uid" != "0"
      - name: Stop the application stack
        if: always()
        run: docker compose -f docker-compose.stack.yml down -v
