[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "celery>=5.5.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.4",
    "pydantic-settings>=2.14.2",
    "pillow>=11.3.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
